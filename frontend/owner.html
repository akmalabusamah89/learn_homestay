<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard — InappRest</title>
    
    <!-- DM Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <style>
        :root {
            --charcoal: #22252a;
            --gold: #cfa052;
            --gold-hover: #b88b42;
            --bg-light: #f8f9fa;
            --text-dark: #1a1a1a;
            --text-muted: #6c757d;
            --border-color: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 56px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-img {
            height: 40px;
            width: auto;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .role-badge {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .btn-outline {
            border: 1px solid var(--border-color);
            background: #fff;
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.2s;
        }

        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn-primary {
            background-color: var(--gold);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--gold-hover);
        }

        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 32px;
        }

        .dashboard-title {
            font-size: 2.25rem;
            font-weight: 700;
        }

        .subtitle {
            color: var(--gold);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .section-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid var(--border-color);
        }

        .section-heading {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .prop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .prop-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }

        .prop-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .prop-body {
            padding: 16px;
        }

        .prop-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .prop-loc {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #ffffff;
            padding: 32px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <header>
    <a href="index.html" class="logo-link" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
    <img src="logo.jpg" alt="InappRest Logo" style="height: 100px; width: auto; display: block; border-radius: 50%;">
    </a>
    <div class="header-actions">
        <span class="role-badge" id="userRoleBadge">Role: house_owner</span>
        <!-- Dynamically injected Admin Portal button for admins -->
        <div id="adminPortalContainer"></div>
        <a href="index.html" class="btn-outline">Home</a>
        <a href="index.html" class="btn-outline" style="border-color: #d9534f; color: #d9534f;" onclick="localStorage.clear()">Log out</a>
    </div>
</header>

    <main>
        <div class="dashboard-header">
            <div>
                <p class="subtitle">OWNER DASHBOARD</p>
                <h1 class="dashboard-title">Welcome back</h1>
            </div>
            <button class="btn-primary" onclick="openAddModal()">+ Add New Property</button>
        </div>

        <!-- My Properties Section -->
        <div class="section-box">
            <h2 class="section-heading">My Properties & Listings</h2>
            <div class="prop-grid" id="ownerPropertiesGrid">
                <!-- Dynamically populated property cards -->
            </div>
        </div>

        <!-- Bookings Overview -->
        <div class="section-box">
            <h2 class="section-heading">Bookings Overview</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Property</th>
                        <th>Guest Name</th>
                        <th>Check-in</th>
                        <th>Check-out</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="bookingsTableBody">
                    <tr>
                        <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 32px;">No bookings found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add Property Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 20px;">Add New Property</h2>
            <form id="addForm">
                <div class="form-group">
                    <label>Property Name / Title</label>
                    <input type="text" id="addName" required placeholder="e.g. Seaside Sanctuary">
                </div>
                <div class="form-group">
                    <label>Property Type</label>
                    <input type="text" id="addType" value="Apartment" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="addLocation" required placeholder="e.g. Penang, Malaysia">
                </div>
                <div class="form-group">
                    <label>Price per Night (RM)</label>
                    <input type="number" id="addPrice" step="0.01" required placeholder="250">
                </div>
                <div class="form-group">
                    <label>Image URL or Filename</label>
                    <input type="text" id="addImage" placeholder="host-villa.jpg">
                </div>
                <div class="form-group">
                    <label>Badge (Optional)</label>
                    <input type="text" id="addBadge" placeholder="Superhost">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-outline" onclick="closeAddModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Create Property</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Property Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 20px;">Edit Property Details</h2>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Property Title</label>
                    <input type="text" id="editTitle" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="editLocation" required>
                </div>
                <div class="form-group">
                    <label>Price per Night (RM)</label>
                    <input type="number" id="editPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Image URL or Filename</label>
                    <input type="text" id="editImage">
                </div>
                <div class="form-group">
                    <label>Badge (e.g. Superhost)</label>
                    <input type="text" id="editBadge">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-outline" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="owner.js?v=3"></script>
</body>
</html>
